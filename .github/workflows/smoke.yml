name: Native proof smoke tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      bundled_image:
        description: Published bundled image by Docker Hub digest
        required: false
        type: string

permissions:
  contents: read

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
            machine: x86_64
          - runner: ubuntu-24.04-arm
            architecture: arm64
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      ARCHITECTURE: ${{ matrix.architecture }}
      EXPECTED_MACHINE: ${{ matrix.machine }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Confirm native architecture
        run: test "$(uname -m)" = "$EXPECTED_MACHINE"
      - name: Build and verify the fixture-free image
        if: ${{ !inputs.bundled_image }}
        run: |
          docker buildx build --platform "linux/$ARCHITECTURE" --load \
            --build-arg "BENCH_REV=$GITHUB_SHA" --tag pq-aggregation-bench:smoke .
          ./scripts/smoke.sh pq-aggregation-bench:smoke
      - name: Verify the published bundled image
        if: ${{ inputs.bundled_image }}
        env:
          BUNDLED_IMAGE: ${{ inputs.bundled_image }}
        run: |
          if [[ ! $BUNDLED_IMAGE =~ ^ethdreamer/pq-aggregation-bench@sha256:[0-9a-f]{64}$ ]]; then
            echo "Provide the bundled Docker Hub image with its full SHA-256 digest" >&2
            exit 1
          fi
          ./scripts/smoke.sh "$BUNDLED_IMAGE" native bundled
