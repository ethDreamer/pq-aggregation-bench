name: Native proof smoke tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proof:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            architecture: amd64
            machine: x86_64
          - runner: ubuntu-24.04-arm
            architecture: arm64
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build on native hardware
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: |
          test "$(uname -m)" = "$EXPECTED_MACHINE"
          docker buildx build --platform "linux/$ARCHITECTURE" --load             --build-arg "BENCH_REV=$GITHUB_SHA" --tag pq-aggregation-bench:smoke .
      - name: Verify proofs and runtime metadata
        run: ./scripts/smoke.sh pq-aggregation-bench:smoke
